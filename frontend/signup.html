<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>SortWise - Create Account</title>

    <link rel="stylesheet" href="auth.css">

</head>

<body>

<div class="auth-container">

    <div class="auth-card">

        <div class="logo">
            ♻️
        </div>

        <h1>Create Account</h1>

        <p class="subtitle">
            Start earning rewards with SortWise
        </p>

        <form id="signupForm">

            <label>Username</label>

            <input
                type="text"
                id="signupUsername"
                placeholder="Choose a username"
                required
            >

            <label>Email</label>

            <input
                type="email"
                id="signupEmail"
                placeholder="Enter your email"
                required
            >

            <label>Password</label>

            <input
                type="password"
                id="signupPassword"
                placeholder="Minimum 6 characters"
                minlength="6"
                required
            >

            <label>Confirm Password</label>

            <input
                type="password"
                id="signupConfirmPassword"
                placeholder="Confirm password"
                required
            >

            <button type="submit">
                Create Account
            </button>

            <p id="signupMessage"></p>

        </form>

        <p class="switch">
            Already have an account?
            <a href="login.html">Login</a>
        </p>

    </div>

</div>

<script src="auth.js"></script>

</body>
</html>
